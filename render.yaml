services:
  - type: web
    name: lumina-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LUMINA_ENV
        value: production
      - key: LUMINA_GUEST_SECRET
        generateValue: true
      - key: LUMINA_MEDIA_SIGNING_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://arelozcan3545-max.github.io
      - key: FIREBASE_PROJECT_ID
        value: lumina-ai-a42e0
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
